<script>
var c=(new URLSearchParams(location.search).get("c")||"").toUpperCase(),r=document.getElementById("r"),rp=document.getElementById("rp"),OK=/^[A-Z2-9]{8}$/.test(c),API=CFG.url+"/functions/v1/"+(CFG.fn||"notify"),HD={"Content-Type":"application/json",apikey:CFG.key};
function say(t,k){r.textContent=t;r.className=k||""}
function post(o,n){return fetch(API,{method:"POST",headers:HD,body:JSON.stringify(o)}).then(function(x){return x.json()}).catch(function(e){if(n)throw e;return new Promise(function(k){setTimeout(k,1500)}).then(function(){return post(o,1)})})}
if(!OK){say("الرابط ده مش صحيح. اتأكد إنك مسحت الـ QR كامل.","er");document.querySelectorAll("button").forEach(function(b){b.disabled=true})}
else post({action:"info",code:c}).then(function(j){if(!j.ok||!j.items||!j.items.length)return;var L={brand:"الماركة",model:"الموديل",year:"السنة",color:"اللون",plate:"اللوحة",name:"الاسم",blood:"فصيلة الدم",emergency:"طوارئ",medical:"ملاحظات طبية"},bx=document.getElementById("inf");j.items.forEach(function(it){var d=document.createElement("div"),b=document.createElement("b");b.textContent=(L[it.k]||it.k)+": ";d.appendChild(b);d.appendChild(document.createTextNode(it.v));bx.appendChild(d)});bx.hidden=false}).catch(function(){});
var CT="",CW=null;
if(CFG.turnstile){var sc=document.createElement("script");sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";sc.async=true;sc.onload=function(){try{CW=turnstile.render("#cf",{sitekey:CFG.turnstile,appearance:"interaction-only",callback:function(t){CT=t},"expired-callback":function(){CT=""},"error-callback":function(){CT=""}})}catch(e){}};document.head.appendChild(sc)}
function tok(){return new Promise(function(ok){var n=0;(function w(){if(!CFG.turnstile||CT||++n>40)return ok(CT);setTimeout(w,200)})()})}
var PT=null;
function watch(rid){var n=0;clearInterval(PT);rp.textContent="⏳ مستنيين رد صاحب العربية (لو بيستخدم التطبيق أو تليجرام)...";
PT=setInterval(function(){if(++n>24||document.hidden&&n>24){clearInterval(PT);if(!rp.dataset.got)rp.textContent="";return}
post({action:"scan_reply",rid:rid}).then(function(j){if(j.ok&&j.reply){clearInterval(PT);rp.dataset.got=1;rp.textContent="💬 صاحب العربية رد: "+j.reply}}).catch(function(){})},8000)}
document.querySelectorAll("button[data-m]").forEach(function(b){b.onclick=function(){
if(!OK){say("الكود مش صحيح.","er");return}
var cb=document.getElementById("cb").value.replace(/[^\d+]/g,""),cb2=document.getElementById("cb2").value.replace(/[^\d+]/g,"");if((cb&&!/^\+?\d{7,15}$/.test(cb))||(cb2&&!/^\+?\d{7,15}$/.test(cb2))){say("رقم التواصل غير صحيح، اكتبه أرقام بس أو سيبه فاضي.","er");return}if(cb2&&!cb){say("اكتب رقمك الأساسي الأول.","er");return}
b.disabled=true;say("جاري الإرسال...");rp.textContent="";delete rp.dataset.got;
tok().then(function(t){return post({code:c,msg:b.dataset.m,cb2:cb2||undefined,cb:cb||undefined,cf:t||undefined})}).then(function(j){CT="";try{if(CW!==null)turnstile.reset(CW)}catch(e){}if(j.ok){say("✓ اتسجّل طلب التنبيه. ده مش تأكيد إن صاحب العربية شافه. لو في خطر اتصل بخدمات الطوارئ.","ok");if(j.rid)watch(j.rid)}else say(j.err||"حصلت مشكلة","er");setTimeout(function(){b.disabled=false},4000)})
.catch(function(){say("مفيش اتصال، حاول تاني.","er");b.disabled=false})}});

(function(){var a=document.getElementById("cb"),b=document.getElementById("cb2"),m=document.getElementById("cbm"),ok=/^\+?\d{7,15}$/;
try{var v=JSON.parse(localStorage.getItem("nb_cb")||"null");if(v){a.value=v[0]||"";b.value=v[1]||""}}catch(e){}
document.getElementById("cbs").onclick=function(){var x=a.value.replace(/[^\d+]/g,""),y=b.value.replace(/[^\d+]/g,"");
if(!x&&!y){try{localStorage.removeItem("nb_cb")}catch(e){}m.textContent="اتمسح. مش هنبعت أي رقم.";return}
if((x&&!ok.test(x))||(y&&!ok.test(y))){m.textContent="الرقم غير صحيح، اكتبه أرقام بس.";return}
if(y&&!x){m.textContent="اكتب رقمك الأساسي الأول.";return}
try{localStorage.setItem("nb_cb",JSON.stringify([x,y]))}catch(e){}m.textContent="✓ اتحفظ، وهيوصل لصاحب العربية مع التنبيه.";};})();
</script></body></html>
