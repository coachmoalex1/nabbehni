<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>نبّهني | NABBEHNI</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#FFFFFF">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#161616;--mute:#6F6F6F;--line:#DCC98F;--acc:#161616;--on:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.w{max-width:480px;margin:auto;text-align:center;padding:32px 0}h1{font-size:28px;margin:8px 0}p{color:var(--mute);line-height:1.8}
button{display:block;width:100%;font:inherit;font-size:18px;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;cursor:pointer}
button:active,button:focus-visible{border-color:var(--acc)}button:disabled{opacity:.5}#r{min-height:28px;font-weight:600;color:var(--acc)}small{color:var(--mute)}
</style></head><body><div class="w">
<h1>ابعت تنبيه لصاحب العربية</h1><p>اختار الرسالة المناسبة. رقمك مش هيظهر، ورقم صاحب العربية كمان مش هيظهر لك.</p>
<button data-m="lights">💡 نور العربية شغال</button><button data-m="window">🪟 الشباك مفتوح</button><button data-m="block">🚧 العربية سادّة الطريق</button><button data-m="other">💬 حاجة تانية</button>
<div id="r"></div><small>نبّهني · <a href="terms.html" style="color:inherit">الشروط والخصوصية</a></small></div>
<script src="config.js"></script>
<script>
var c=(new URLSearchParams(location.search).get("c")||"").toUpperCase(),r=document.getElementById("r");
if(!/^[A-Z2-9]{8}$/.test(c)){r.textContent="الرابط ده مش صحيح. اتأكد إنك مسحت الـ QR كامل.";document.querySelectorAll("button").forEach(function(b){b.disabled=true})}
document.querySelectorAll("button").forEach(function(b){b.onclick=function(){
if(!/^[A-Z2-9]{8}$/.test(c)){r.textContent="الكود مش صحيح.";return}
b.disabled=true;r.textContent="جاري الإرسال...";
fetch(CFG.url+"/functions/v1/"+(CFG.fn||"notify"),{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.key,...(/^sb_/.test(CFG.key)?{}:{Authorization:"Bearer "+CFG.key})},body:JSON.stringify({code:c,msg:b.dataset.m})})
.then(function(x){return x.json()}).then(function(j){r.textContent=j.ok?"✓ اتبعت التنبيه لصاحب العربية. شكرًا ليك!":(j.err||"حصلت مشكلة");setTimeout(function(){b.disabled=false},4000)})
.catch(function(){r.textContent="مفيش اتصال، حاول تاني.";b.disabled=false})}});
</script></body></html>
